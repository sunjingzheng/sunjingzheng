<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jingzheng Sun">
  <title>Jingzheng Sun</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E7EEF7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
